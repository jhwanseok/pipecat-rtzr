[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-rtzr"
version = "0.1.0.dev0"
description = "RTZR (Return Zero) VITO streaming Korean speech-to-text service for Pipecat"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }
keywords = ["pipecat", "rtzr", "vito", "korean", "stt", "speech-to-text", "voice-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "pipecat-ai>=1.13.0,<2",
  "aiohttp>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_rtzr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
